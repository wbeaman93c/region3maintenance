<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Region 3 | Fleet Maintenance</title><style>:root{font-family:Inter,system-ui,Arial;background:#f3f6fa;color:#18283a}*{box-sizing:border-box}body{margin:0}header{background:#102b40;color:white;padding:19px 28px;display:flex;justify-content:space-between;align-items:center}header small{color:#b5c9d7}main{max-width:1250px;margin:auto;padding:24px}nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:22px}button{cursor:pointer;background:#146c75;color:white;border:0;border-radius:7px;padding:10px 14px;font-weight:600}nav button{background:white;color:#244052;border:1px solid #dce4ec}nav button.active{background:#146c75;color:white}.panel,.metric{background:white;border:1px solid #e0e6ee;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px #142b4010}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric strong{font-size:30px;display:block}.metric small{color:#637689}table{width:100%;border-collapse:collapse}th,td{padding:11px;text-align:left;border-bottom:1px solid #e9edf2;font-size:14px}th{color:#627487}input,select,textarea{padding:10px;border:1px solid #cdd8e2;border-radius:7px;width:100%;font:inherit}label{font-size:13px;color:#42576a;display:block;margin:10px 0 5px}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.badge{padding:5px 9px;border-radius:20px;font-size:12px;background:#e5edf4;color:#314b61;white-space:nowrap}.warning{background:#fff1cf;color:#875900}.danger{background:#ffe1e0;color:#a32020}.good{background:#d9f4e5;color:#176442}.muted{color:#718092}h2{margin:0 0 16px}#login{max-width:400px;margin:12vh auto}.hidden{display:none!important}.scroll{overflow:auto}.actions{display:flex;gap:10px;align-items:center;margin-top:15px}#message{margin:10px 0;color:#b42a2a}@media(max-width:750px){.metrics{grid-template-columns:repeat(2,1fr)}.fields{grid-template-columns:1fr}main{padding:12px}header{padding:15px}}
/* Region 3 professional light workspace — desktop and iPad */
:root{color-scheme:light;background:#f6f8fa;color:#243242;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{background:#f6f8fa;min-height:100vh}
.hero{width:100%;aspect-ratio:1672/284;max-height:250px;min-height:100px;background:#e7eaed url('/region3-banner.png') center/contain no-repeat;border-bottom:1px solid #d8e0e6}
header{background:#fff;color:#243242;border-bottom:1px solid #dce3e9;padding:16px clamp(16px,3vw,36px);gap:16px;box-shadow:0 1px 3px #1d30400a}
header .brand{display:flex;align-items:center;gap:12px;letter-spacing:.025em;font-weight:750}
header .brand-mark{width:4px;height:35px;border-radius:3px;background:#648e30}
header small{color:#6a7987;letter-spacing:.035em}
#who{display:flex;align-items:center;gap:12px;font-size:13px;color:#526273}
main{max-width:1540px;padding:26px clamp(16px,3vw,36px)}
nav{gap:8px;margin-bottom:22px}
nav button{background:#fff;color:#435364;border:1px solid #d9e2e9;border-radius:8px;padding:11px 15px}
nav button.active{background:#243a4b;color:#fff;border-color:#243a4b}
button{background:#2f5667;color:white;border-radius:8px;min-height:42px;padding:10px 16px}
button:hover{filter:brightness(.94)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #a9c7dc;outline-offset:2px}
.panel,.metric{background:#fff;border:1px solid #dfe6ec;border-radius:11px;color:#263849;box-shadow:0 2px 8px #1b34400a}
.metric{border-top:3px solid #789d49;padding:22px}.metric strong{color:#253f50;font-size:clamp(24px,2.5vw,32px)}
.metric small,th,.muted{color:#687b8c}h2{color:#273b4b;font-size:19px;font-weight:700}
th{background:#f8fafb;font-weight:700}th,td{border-bottom-color:#e8edf1;vertical-align:middle}
tr:hover td{background:#fbfcfd}
input,select,textarea{background:#fff;color:#263849;border:1px solid #cbd6df;min-height:43px;font-size:16px}
label{color:#455b6d;font-weight:600}.badge{background:#edf2f5;color:#41576a}
.warning{background:#fff3d8;color:#895e00}.danger{background:#fde8e8;color:#a12b2b}.good{background:#e4f3e8;color:#226744}
#login{margin:40px auto;max-width:460px}#login h2{border-left:4px solid #789d49;padding-left:12px}
.scroll{-webkit-overflow-scrolling:touch}table{min-width:680px}
@media(min-width:1100px){.metrics{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(min-width:760px) and (max-width:1099px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.fields{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:22px}nav button{padding:12px 13px}}
@media(max-width:759px){.hero{min-height:65px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.fields{grid-template-columns:1fr}main{padding:16px 12px}header{padding:12px;align-items:flex-start;flex-wrap:wrap}header .brand{font-size:13px}header small{font-size:10px}nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}nav button{min-height:46px;padding:9px}.panel{padding:16px}.metric{padding:15px}.metric strong{font-size:26px}}
</style></head><body><div class="hero" role="img" aria-label="Rural Service Patrol Region 3 Tennessee Department of Transportation banner"></div><header><div class="brand"><span class="brand-mark" aria-hidden="true"></span><div><b>REGION 3 MAINTENANCE</b><br><small>RURAL SERVICE PATROL · FLEET OPERATIONS</small></div></div><div id="who"></div></header><main><section id="login" class="panel"><h2>Staff Sign In</h2><form id="loginForm"><label>Email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" required><div class="actions"><button>Sign in</button></div></form><p id="loginError"></p></section><section id="app" class="hidden"><nav id="nav"></nav><div id="content"></div></section></main><script>
let user=null,vehicles=[],users=[],orders=[],services=[],equipment=[],inventory=[];const tabs=['Dashboard','Fleet','Work Orders','Services','Equipment Requests','Inventory','Users'];const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const opts=(arr,sel)=>arr.map(x=>`<option ${String(x)===String(sel)?'selected':''}>${esc(x)}</option>`).join('');const unitOpts=()=>vehicles.map(v=>`<option>${v.unit}</option>`).join('');const pill=s=>`<span class="badge ${/overdue|out of service/i.test(s)?'danger':/due soon|waiting|maintenance/i.test(s)?'warning':/current|operational|completed|received/i.test(s)?'good':''}">${esc(s)}</span>`;
async function api(url,method='GET',data){const r=await fetch('/api/'+url,{method,headers:{'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}const formData=f=>Object.fromEntries(new FormData(f));async function submit(e,url,method='POST',transform=x=>x){e.preventDefault();try{await api(url,method,transform(formData(e.target)));await refresh();render(current)}catch(err){alert(err.message)}}let current='Dashboard';async function refresh(){[vehicles,users,orders,services,equipment,inventory]=await Promise.all(['vehicles','users','work-orders','services','equipment','inventory'].map(x=>api(x)))}function form(title,fields,button='Save'){return `<div class="panel"><h2>${title}</h2><form id="entry"><div class="fields">${fields}</div><div class="actions"><button>${button}</button></div></form></div>`}function field(name,label,type='text',options){return `<div><label>${label}</label>${options?`<select name="${name}">${options}</select>`:`<input name="${name}" type="${type}" ${type==='number'?'min="0"':''} required>`}</div>`}function table(head,rows){return `<div class="panel scroll"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${head.length}" class="muted">No records yet</td></tr>`}</tbody></table></div>`}const tr=(...xs)=>`<tr>${xs.map(x=>`<td>${x}</td>`).join('')}</tr>`;
function render(tab){current=tab;$('nav').innerHTML=tabs.filter(t=>t!=='Users'||user.role==='management').map(t=>`<button class="${tab===t?'active':''}" data-tab="${t}">${t}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>render(b.dataset.tab));let html='';if(tab==='Dashboard'){let soon=vehicles.filter(v=>v.oil_status==='Due Soon').length,due=vehicles.filter(v=>v.oil_status==='Due / Overdue').length,down=vehicles.filter(v=>v.status==='Out of Service').length;html=`<div class="metrics">${[['Fleet Units',vehicles.length],['Out of Service',down],['Oil Service Due Soon',soon],['Oil Service Due / Overdue',due]].map(([k,v])=>`<div class="metric"><strong>${v}</strong><small>${k}</small></div>`).join('')}</div><div class="panel"><h2>Maintenance Alerts</h2>${vehicles.filter(v=>v.oil_status!=='Current').map(v=>`<p>Unit <b>${v.unit}</b> — ${pill(v.oil_status)} · ${v.last_oil_mileage==null?'Set initial oil change mileage':`Next service: ${v.next_oil_mileage} mi`}</p>`).join('')||'All services current'}</div>`}
if(tab==='Fleet'){html=form('Update Truck Mileage / Status',field('unit','Truck','text',unitOpts())+field('mileage','Current Odometer','number')+field('status','Truck Status','text',opts(['Operational','In Maintenance','Out of Service'])),'Update Truck')+table(['Unit','Odometer','Last Oil Change','Next Oil Change','Miles Remaining','Oil Status','Truck Status'],vehicles.map(v=>tr(v.unit,esc(v.mileage),v.last_oil_mileage??'Not set',v.next_oil_mileage??'—',v.next_oil_mileage==null?'—':v.next_oil_mileage-v.mileage,pill(v.oil_status),pill(v.status))))}
if(tab==='Work Orders'){html=form('New Work Order',field('unit','Truck','text',unitOpts())+field('title','Repair / Issue')+field('priority','Priority','text',opts(['Normal','High','Critical']))+field('description','Description'))+table(['#','Unit','Issue','Priority','Status','Update'],orders.map(o=>tr(o.id,o.unit,esc(o.title),esc(o.priority),pill(o.status),`<select data-order="${o.id}">${opts(['Open','In Progress','Waiting on Parts','Completed'],o.status)}</select>`)))}
if(tab==='Services'){html=form('Record Completed Service',field('unit','Truck','text',unitOpts())+field('service_type','Service Type','text',opts(['Oil Change','Tires','Brakes','Inspection','Other']))+field('mileage','Service Odometer','number')+field('notes','Service Notes'))+table(['Date','Unit','Service','Mileage','Notes'],services.map(s=>tr(new Date(s.created_at).toLocaleDateString(),s.unit,esc(s.service_type),s.mileage,esc(s.notes))))}
if(tab==='Equipment Requests'){html=form('New Equipment Report / Order',field('unit','Truck','text',unitOpts())+field('item','Equipment / Item')+field('quantity','Quantity','number')+field('request_type','Request Type','text',opts(['Missing','Damaged','Replacement','New Order','Supplies']))+field('details','Details'))+table(['#','Unit','Item','Qty','Type','Status','Update'],equipment.map(e=>tr(e.id,e.unit,esc(e.item),e.quantity,esc(e.request_type),pill(e.status),user.role==='mechanic'?'—':`<select data-equipment="${e.id}">${opts(['Requested','Approved','Ordered','Received','Denied'],e.status)}</select>`)))}
if(tab==='Inventory'){html=(user.role==='mechanic'?'':form('Add / Update Inventory',field('item','Item')+field('quantity','Stock Quantity','number')+field('notes','Notes')))+table(['Item','Quantity','Notes'],inventory.map(i=>tr(esc(i.item),i.quantity,esc(i.notes))))}
if(tab==='Users'){html=form('Create Staff Login',field('name','Full Name')+field('email','Email','email')+field('password','Temporary Password (12+ characters)','password')+field('role','Role','text',opts(['management','supervisor','mechanic'])))+table(['Name','Role'],users.map(u=>tr(esc(u.name),esc(u.role))))}
$('content').innerHTML=html;const f=$('entry');if(f)f.onsubmit=e=>{if(tab==='Fleet'){const d=formData(f);return submit(e,'vehicles/'+d.unit,'PATCH',x=>({mileage:Number(x.mileage),status:x.status}))}const endpoint={'Work Orders':'work-orders','Services':'services','Equipment Requests':'equipment','Inventory':'inventory','Users':'users'}[tab];submit(e,endpoint,'POST',x=>{if(x.quantity!==undefined)x.quantity=Number(x.quantity);if(x.mileage!==undefined)x.mileage=Number(x.mileage);return x})};document.querySelectorAll('[data-order]').forEach(el=>el.onchange=async()=>{try{await api('work-orders/'+el.dataset.order,'PATCH',{status:el.value});await refresh();render(tab)}catch(e){alert(e.message)}});document.querySelectorAll('[data-equipment]').forEach(el=>el.onchange=async()=>{try{await api('equipment/'+el.dataset.equipment,'PATCH',{status:el.value});await refresh();render(tab)}catch(e){alert(e.message)}})}
async function start(){const me=await api('me');user=me.user;$('login').classList.toggle('hidden',!!user);$('app').classList.toggle('hidden',!user);$('who').innerHTML=user?`${esc(user.name)} · ${esc(user.role)} <button id="logout">Log out</button>`:'';if(user){$('logout').onclick=async()=>{await api('logout','POST');location.reload()};await refresh();render('Dashboard')}}$('loginForm').onsubmit=async e=>{e.preventDefault();try{await api('login','POST',formData(e.target));await start()}catch(err){$('loginError').textContent=err.message}};start().catch(e=>{$('loginError').textContent=e.message});
</script></body></html>
